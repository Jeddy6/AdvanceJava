<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Web Output #1</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>JavaScript Web Output #1</h1>

    <label>Insert any Positive Numbers:</label>
    <input type="number" id="numberInput">

    <br>

    <button onclick="insertNumber()">Insert</button>
    <button onclick="clearEntry()">Clear Entry</button>

    <fieldset>
        <legend>Inserted Numbers</legend>

        <div id="numbers"></div>

        <br>

        <b>TOTAL</b>
        <span id="total">0</span>

        <br>

        <b>HIGHEST</b>
        <span id="highest">-</span>

        <br>

        <b>LOWEST</b>
        <span id="lowest">-</span>

    </fieldset>

    <button onclick="clearItems()">Clear Items</button>
    <button onclick="getTotal()">Get Total</button>
    <button onclick="findHighestLowest()">
        Identify Highest and Lowest Number
    </button>

    <label>Sort by:</label>

    <select onchange="sortNumbers(this.value)">
        <option value="">Please select</option>
        <option value="asc">Lowest to Highest</option>
        <option value="desc">Highest to Lowest</option>
    </select>

    <script src="script.js"></script>

</body>
</html>
